[package]
name = "json-to-xlsx"
version = "0.1.4"
authors = [
    "Lukas Matta <hello@lukasmatta.com>",
]
edition = "2024"
license = "MIT"
repository = "https://github.com/lukasmatta/json-to-xlsx.git"
keywords = ["xlsx", "json", "excel"]
description = "Convert a JSON array of objects to Excel (.xlsx). No COM/OLE/LibreOffice dependencies — works on Linux, macOS, and Windows."
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
zip = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

